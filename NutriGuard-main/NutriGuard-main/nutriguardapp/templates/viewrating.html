<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewcomplaint</title>
</head>
<body>
    <div>
        <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
            <tr style="background-color: #f2f2f2;">
                <th>User</th>
                <th>Rating</th>
                <th>Review</th>
                <th>Date</th>
            </tr>
            {% for r in ratings %}
            <tr>
                <td>{{ r.user_id.name }}<br><small>{{ r.user_id.email }}</small></td>
                <td style="color: #f59e0b; font-size: 16px; font-weight: bold;">{{ r.rating }} / 5 ★</td>
                <td>{{ r.review|default:"No comment" }}</td>
                <td>{{ r.send_date }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4" style="text-align: center; color: gray;">No ratings submitted yet.</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
